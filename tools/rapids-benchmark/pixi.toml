[workspace]
channels = ["conda-forge"]
name = "sc_rapids"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
kernel = "python -m ipykernel install --user --name rapids --display-name 'Python (rapids)'"

[dependencies]
python = ">=3.12,<3.13"
pip = ">=24"
ipykernel = ">=7.2.0,<8"
anndata = ">=0.12.14,<0.13"
numpy = "<2.5"

[pypi-dependencies]
dask-cuda = "*"
rapids-singlecell-cu13 = "*"
cudf-cu13 = "*"
cuml-cu13 = "*"
cugraph-cu13 = "*"
cuvs-cu13 = "*"
rmm-cu13 = "*"

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]

