[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zarrsmith"
version = "0.3.0"
description = "Edit existing AnnData zarr stores in place: add-expr, rechunk, sort, append"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "Alex Holly", email = "alex.holly@alleninstitute.org" }]
# the shared core (sources/writers/engine/layout/config/storage) lives in
# convert-to-zarr; this tool is the store-editing layer on top of it
dependencies = [
  "convert-to-zarr",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zarrsmith = "zarrsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zarrsmith*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
zarrsmith = { path = ".", editable = true }
convert-to-zarr = { path = "../convert-to-zarr", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
anndata = ">=0.12.10,<0.13"  # matches convert-to-zarr's validated floor
numpy = "<2.5"
scanpy = ">=1.12.1,<2"
dask = ">=2026.3.0,<2027"
