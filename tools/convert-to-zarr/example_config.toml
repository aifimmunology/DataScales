[io]
overwrite = false
consolidate_metadata = false
# x_storage: "sparse-csr" (default), "sparse-csc" (force CSC), "dense" (force dense)
x_storage = "sparse-csr"
backed = false
# backend: "zarr" (default, plain on-disk) or "icechunk" (transactional/versioned repo,
# one commit per conversion). icechunk requires eager input (not backed) for now.
backend = "zarr"
icechunk_storage = "local"   # "gcs" is scaffolded but not wired up yet
# gcs_bucket = "my-bucket"
# gcs_prefix = ""

[chunks]
x_row_chunk = 1000
x_col_chunk = 1000
sparse_flat_chunk = 1000000
cpus = 1
# Pack dense X inner chunks into shards of (x_row_chunk, x_col_chunk) * factor. 1 = no sharding.
# Use >1 with small chunks to keep read granularity fine while cutting file/object count (dense X only).
x_shard_factor = 1

[validation]
reject_spatial = true
require_non_empty = true
min_obs = 1
min_vars = 1

# Sort + partition X by obs columns (convert-h5ad, sparse-csr or dense, eager only). When
# enabled, rows are physically sorted by sort_by (primary key first) so each distinct key tuple
# is a contiguous block. Output is a plain sorted AnnData with no convert-to-zarr-specific metadata:
# read a subset by deriving the contiguous range from the (now sorted) obs column and slicing
# X[start:end] with stock anndata/zarr — no convert-to-zarr dependency needed to query the store.
[grouping]
enabled = false
sort_by = ["AIFI_L1", "batch_id"]

# obs-column policy for concat-h5ads. Empty (default) requires an identical obs schema across
# all inputs. A non-empty list keeps only those obs columns (each input must contain them; obs
# is projected to exactly these, others dropped). A kept categorical column must have identical
# categories across inputs, else it's a hard error (concat would degrade it to a slow string
# array). concat-h5ads only.
[concat]
obs_columns = []
