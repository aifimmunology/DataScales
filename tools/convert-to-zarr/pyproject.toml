[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convert-to-zarr"
version = "0.3.0"
description = "Convert and concatenate single-cell data (.h5ad, 10x .h5) into AnnData zarr stores"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "Alex Holly", email = "alex.holly@alleninstitute.org" }]
dependencies = [
  "anndata>=0.12.10,<0.13",
  "zarr>=3.0.0",
  "numpy>=1.24.0,<2.5",
  "scipy>=1.10.0",
  "PyYAML>=6.0",
  "scanpy>=1.9.0",
  "dask[array]>=2026.3",
  "icechunk>=2.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
convert-to-zarr = "convert_to_zarr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["convert_to_zarr*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
convert-to-zarr = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
anndata = ">=0.12.10,<0.13"  # 0.13 injects a phantom None layer key that breaks the layer writer; 0.12.10 is the validated floor
numpy = "<2.5"
scanpy = ">=1.12.1,<2"
dask = ">=2026.3.0,<2027"
