repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict src/annizarr
        entry: pixi run -e default mypy --strict src/annizarr
        language: system
        pass_filenames: false
        files: ^src/annizarr/
