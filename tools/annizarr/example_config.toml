[io]
overwrite = false
consolidate_metadata = false
x_storage = "csr"  # "csr" (default), "csc", or "dense"
lazy = true  # stream input band by band (default); false loads it whole into memory first
backend = "zarr"  # "zarr" (default) or "icechunk" (one commit per op)

[chunks]
x_row_chunk = 1000
x_col_chunk = 1000
sparse_flat_chunk = 1000000
# cpus = 8  # default: all cores
x_shard_factor = 1  # pack this many dense-X chunks per shard; 1 = no sharding
auto_shard = false  # shard our 1-D sparse arrays + anndata's own writes with shards="auto"

[validation]
reject_spatial = true
require_non_empty = true
min_obs = 1
min_vars = 1

[grouping]
enabled = false
sort_by = ["AIFI_L1", "batch_id"]  # physically sort+partition X by these obs columns (convert only)

[concat]
obs_columns = []  # empty = require identical obs schema across inputs; else project to this subset
