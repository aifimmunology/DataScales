[workspace]
name = "annizarr"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
python = ">=3.12,<3.14"
anndata = ">=0.12.10,<0.13"
zarr = ">=3.3,<4"
scipy = ">=1.10"
h5py = ">=3.8"
pyyaml = ">=6"

[pypi-dependencies]
annizarr = { path = ".", editable = true }

[feature.test.dependencies]
pytest = ">=8"
pytest-cov = "*"
hypothesis = "*"

[feature.py312.dependencies]
# floor-testing env: zarr>=3.3 itself requires python>=3.12 (PyPI/conda-forge metadata,
# every 3.2.0+ release), so the real floor is 3.12, not the 3.10 the spec assumed
python = "3.12.*"
icechunk = ">=2.1.2,<3"
boto3 = ">=1.28"

[feature.dev.dependencies]
ruff = "*"
mypy = "*"
types-pyyaml = "*"
moto = ">=5"
boto3 = ">=1.28"
icechunk = ">=2.1.2,<3"
scanpy = ">=1.12.1,<2"  # dev only: reference for the h5py 10x reader test
python-build = "*"
twine = "*"
pre-commit = "*"

[environments]
default = { features = ["dev", "test"], solve-group = "default" }
core = { features = ["test"], solve-group = "core" }
py312 = { features = ["py312", "test"], solve-group = "py312" }
