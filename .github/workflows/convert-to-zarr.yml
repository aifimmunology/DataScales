# convert-to-zarr was merged into annizarr (https://github.com/A-Jolly-Holly/annizarr); this workflow is kept
# dormant (it only fires if the tool's pyproject returns) so the repo retains a workflow for code scanning.
name: convert-to-zarr

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/convert-to-zarr/pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'tools/convert-to-zarr/pyproject.toml'

defaults:
  run:
    working-directory: tools/convert-to-zarr

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: tools/convert-to-zarr/pyproject.toml
          environments: dev
          cache: true

      - name: Tool test suite
        run: pixi run -e dev pytest tests/ -v
