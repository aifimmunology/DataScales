# Gate on PRs to main for the zarrsmith store-editing tool. Runs on changes to the
# tool or to convert-to-zarr (its shared core is a path dependency).
name: zarrsmith

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/zarrsmith/**'
      - 'tools/convert-to-zarr/**'
      - '.github/workflows/zarrsmith.yml'
  push:
    branches: [main]
    paths:
      - 'tools/zarrsmith/**'
      - 'tools/convert-to-zarr/**'
      - '.github/workflows/zarrsmith.yml'

defaults:
  run:
    working-directory: tools/zarrsmith

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: tools/zarrsmith/pyproject.toml
          environments: dev
          cache: true

      - name: Tool test suite
        run: pixi run -e dev pytest tests/ -v
