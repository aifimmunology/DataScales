[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datascale"
version = "0.1.0"
description = "Configurable AnnData to Zarr converter with strong validation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DataScale" }]
dependencies = [
  "anndata>=0.10.0",
  "zarr>=2.18.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "PyYAML>=6.0",
  "scanpy>=1.9.0",
  "dask[array]>=2023.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
datascale = "datascale.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datascale*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
datascale = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
[tasks]
kernel = "python -m ipykernel install --user --name <kernelname> --display-name 'Python (<kernelname>)'"

[tool.pixi.dependencies]
scanpy = ">=1.12.1,<2"
dask = ">=2026.3.0,<2027"
notebook = ">=7.5.6,<8"
