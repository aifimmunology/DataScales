[project]
name = "datascales-project"
version = "0.1.0"
description = "DataScale project hub — installable tools/ plus per-cohort project folders"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Holly", email = "alex.holly@alleninstitute.org" }]

# The hub is not itself a Python package — each tool under tools/ is its own installable
# package with its own pixi environment. This env serves the project folders (notebooks,
# analyses) that read/write stores.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.dependencies]
scanpy = ">=1.12.1,<2"
dask = ">=2026.3.0,<2027"
notebook = ">=7.5.6,<8"
gcsfs = ">=2026.3.0"
anndata = ">=0.11"
zarr = ">=3.0"

[tool.pixi.tasks]
kernel = "python -m ipykernel install --user --name datascales --display-name 'Python (datascales)'"
