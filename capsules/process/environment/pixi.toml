# Same packages as requirements.txt, for use outside Code Ocean.
# Code Ocean installs from the environment page; keep the three in step (see ../../README.md).
[workspace]
name = "datascales-process"
channels = ["conda-forge"]
platforms = [{ name = "linux-64-cuda-13", platform = "linux-64", cuda = "13" }]

[dependencies]
python = "3.13.*"

[pypi-dependencies]
annizarr = "==0.2.3"
icechunk = "==2.3.0"
boto3 = "==1.43.114"
zarr = "==3.4.1"
anndata = "==0.13.4"
numpy = "==2.4.6"
pandas = "==3.0.6"
scipy = "==1.18.1"
h5py = "==3.16.0"
pytest = "==9.1.1"
rapids-singlecell-cu13 = "==0.18.1"
cudf-cu13 = "==26.10.2"
cuml-cu13 = "==26.10.0"
cugraph-cu13 = "==26.10.0"
cuvs-cu13 = "==26.10.0"
rmm-cu13 = "==26.10.0"
dask-cuda = "==26.10.0"
cupy-cuda13x = "==14.2.0"
cuda-toolkit = "==13.0.3.0"
numba = "==0.64.0"
numba-cuda = "==0.30.4"
dask = "==2026.7.1"
distributed = "==2026.7.1"
torch = "==2.14.1"
scanpy = "==1.12.4"
scvi-tools = "==1.5.1"
matplotlib = "==3.11.2"
scikit-misc = "==0.5.3"
ipykernel = "==7.4.0"
squidpy = "==1.8.3"
spatialdata = "==0.8.0"
omnipath = "==1.0.12"
