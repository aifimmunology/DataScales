# Same packages as requirements.txt, for use outside Code Ocean.
# Code Ocean installs from the environment page; keep the two in step (see ../../README.md).
[workspace]
name = "datascales-spatial-ingest"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
annizarr = "==0.2.4"
icechunk = "==2.3.0"
boto3 = "==1.43.114"
zarr = "==3.4.1"
anndata = "==0.13.4"
numpy = "==2.4.6"
pandas = "==3.0.6"
scipy = "==1.18.1"
h5py = "==3.16.0"
pytest = "==9.1.1"
scanpy = "==1.12.4"
celltypist = "==1.7.1"
spatialdata = "==0.8.0"
spatialdata-io = "==0.7.1"
geopandas = "==1.2.0"
pyarrow = "==26.0.1"
s3fs = "==2026.9.0"
moto = "==5.2.5"
