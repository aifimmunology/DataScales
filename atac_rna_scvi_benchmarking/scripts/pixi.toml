[workspace]
channels = ["conda-forge"]
name = "scvi_pca"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.12,<3.13"
pip = ">=24"
anndata = ">=0.12.14,<0.13"
zarr = ">=3,<4"
numpy = "<2.5"
pandas = "*"
pyarrow = "*"
matplotlib = "*"
psutil = "*"
gcsfs = ">=2026.8.0,<2027"
tomli-w = "*"

[pypi-dependencies]
scvi_pca = { path = ".", editable = true }
dask-cuda = "*"
rapids-singlecell-cu13 = "*"
cudf-cu13 = "*"
cuml-cu13 = "*"
cugraph-cu13 = "*"
cuvs-cu13 = "*"
rmm-cu13 = "*"
scvi-tools = "*"
torch = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
nvidia-ml-py = "*"
adjustText = "*"
pydantic-settings = "*"
python-dotenv = "*"

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]

[feature.metrics.dependencies]
python = ">=3.12,<3.13"
anndata = ">=0.12.14,<0.13"
numpy = "<2.5"
pandas = "*"
pyarrow = "*"
scikit-learn = "*"

[feature.metrics.pypi-dependencies]
scvi_pca = { path = ".", editable = true }
scib-metrics = "*"
jax = { version = "*", extras = ["cuda13"] }

[environments]
metrics = { features = ["metrics"], no-default-feature = true }
