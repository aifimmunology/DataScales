[workspace]
channels = ["conda-forge"]
name = "icechunk_multiuser"
platforms = ["linux-64"]
version = "0.1.0"

# GPU/CUDA-only workflow (icechunk_rapids_demo.py). Run on the server:
#   pixi run python icechunk_rapids_demo.py
[dependencies]
python = ">=3.12,<3.13"
pip = ">=24"
anndata = ">=0.12.14,<0.13"
numpy = "<2.5"
zarr = ">=3"
icechunk = ">=2.0.6,<3"

[pypi-dependencies]
dask-cuda = "*"
rapids-singlecell-cu13 = "*"
cudf-cu13 = "*"
cuml-cu13 = "*"
cugraph-cu13 = "*"
cuvs-cu13 = "*"
rmm-cu13 = "*"

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]
