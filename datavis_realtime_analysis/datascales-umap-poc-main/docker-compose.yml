services:
  frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    # values come from .env (auto-loaded, gitignored); pipeline args live in
    # ../rerun_umap_on_selection.py
    environment:
      DATA_DIR: ${DATA_DIR}
      GPU_INSTANCE: ${GPU_INSTANCE:-}   # unset -> 10s simulator
      GPU_ZONE: ${GPU_ZONE:-}
      GPU_PIXI_DIR: ${GPU_PIXI_DIR:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ~/.config/gcloud:/gcloud-ro:ro
      - ~/.ssh/google_compute_engine:/ssh-ro/google_compute_engine:ro
      - ~/.ssh/google_compute_engine.pub:/ssh-ro/google_compute_engine.pub:ro
      - ../gpu_job.sh:/gpu_job.sh:ro
      - ../rerun_umap_on_selection.py:/rerun_umap_on_selection.py:ro
      # local store instead of GCS: uncomment and run with DATA_DIR=/data
      # - ./data/soundlife-other-tiny.zarr:/data:ro
