services:
  frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: ${DATA_DIR}
      GPU_INSTANCE: ${GPU_INSTANCE:-my-gpu-instance}
      GPU_ZONE: ${GPU_ZONE:-us-central1-c}
      GPU_PIXI_DIR: ${GPU_PIXI_DIR:-/mnt/DataScales/rapids_user_notebook}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      # any RERUN_* var set here is forwarded to the GPU job as pipeline tuning,
      # e.g. RERUN_THREADS_PER_WORKER: "1"  /  RERUN_EAGER_MAX: "200000"
    volumes:
      - ~/.config/gcloud:/gcloud-ro:ro
      - ~/.ssh/google_compute_engine:/ssh-ro/google_compute_engine:ro
      - ~/.ssh/google_compute_engine.pub:/ssh-ro/google_compute_engine.pub:ro
      - ../gpu_job.sh:/gpu_job.sh:ro
      - ../rerun_umap_on_selection.py:/rerun_umap_on_selection.py:ro
      # local store instead of GCS: uncomment and run with DATA_DIR=/data
      # - ./data/soundlife-other-tiny.zarr:/data:ro
