services:
  frontend:
    build: .
    ports:
      - "8000:80"  # the single app port — the IAP tunnel targets VM:8000 (UI + /api via nginx)
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    # GCS auth comes from the VM metadata server (the VM's service account).
    environment:
      DATA_DIR: ${DATA_DIR}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./gpu:/app/gpu:ro  # pipeline edits without an image rebuild
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
