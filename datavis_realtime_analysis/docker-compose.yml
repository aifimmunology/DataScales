services:
  frontend:
    build: .
    ports:
      - "8000:80"  # the single app port — the IAP tunnel targets VM:8000 (UI + /api via nginx)
    depends_on:
      backend:
        condition: service_started
        restart: true  # nginx resolves `backend` once at start; follow a recreated backend

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    user: "${APP_UID:-0}:${APP_GID:-0}"  # host uid/gid so store writes stay editable on the host, not needed
    environment:
      LOCAL_DATA: ${LOCAL_DATA:-}
      GCS_DATA: ${GCS_DATA:-}
      EMBED_METHOD: ${EMBED_METHOD:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      HOME: /tmp
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ~/.config/gcloud:/gcloud:ro                # ADC from `gcloud auth application-default login`
      - ./gpu:/app/gpu:ro                          # pipeline edits without an image rebuild
      - ${LOCAL_MOUNT:-/mnt}:/data                 # host disk holding LOCAL_DATA stores
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
